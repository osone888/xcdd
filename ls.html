<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随机抽取一位老师上课</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            max-width: 100%;
            margin: 15px auto;
            padding: 0 10px;
            text-align: center;
            background: #f5f5f5;
        }
        .title {
            font-size: 22px;
            color: #333;
            margin-bottom: 15px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin-bottom: 20px;
        }
        .grid-item {
            padding: 8px 4px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            word-break: break-all;
            cursor: pointer;
            user-select: none;
        }
        .rolling {
            background: #ffcc00;
            color: #000;
            font-weight: bold;
            border-color: #ff9900;
        }
        .selected {
            background: #ff4444;
            color: white;
            font-weight: bold;
            border-color: #cc0000;
        }
        .btn {
            padding: 12px 20px;
            font-size: 16px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            transition: 0.2s;
            min-width: 100px;
        }
        .btn:disabled {
            background: #90caf9;
            cursor: not-allowed;
        }
        .reset-btn {
            background: #607D8B;
        }
        .result {
            font-size: 20px;
            margin: 15px 0;
            color: #d32f2f;
            font-weight: bold;
            min-height: 28px;
        }
    </style>
</head>

        ];

        const grid = document.getElementById('nameGrid');
        const drawBtn = document.getElementById('drawBtn');
        const result = document.getElementById('result');
        let rollingTimer;
        let lastIndex = -1;

        window.onload = function() {
            names.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'grid-item';
                div.id = `item${index}`;
                div.textContent = item.name;
                
                // 点击跳转到对应网址
                div.onclick = function() {
                    window.open(item.url, '_blank');
                };
                
                grid.appendChild(div);
            });
        };

        function startRoll() {
            drawBtn.disabled = true;
            reset();
            result.textContent = "随机选取中...";
            const rollDuration = 5000;
            const rollSpeed = 80;

            rollingTimer = setInterval(() => {
                if (lastIndex !== -1) {
                    document.getElementById(`item${lastIndex}`).classList.remove('rolling');
                }
                let randomIndex = Math.floor(Math.random() * names.length);
                lastIndex = randomIndex;
                document.getElementById(`item${randomIndex}`).classList.add('rolling');
            }, rollSpeed);

            setTimeout(() => {
                clearInterval(rollingTimer);
                document.querySelectorAll('.grid-item').forEach(item => {
                    item.classList.remove('rolling');
                });
                const finalIndex = Math.floor(Math.random() * names.length);
                const finalName = names[finalIndex].name;
                document.getElementById(`item${finalIndex}`).classList.add('selected');
                result.textContent = `🎉 抽中：${finalName} 点击名字即可展开资料`;
                drawBtn.disabled = false;
            }, rollDuration);
        }

        function reset() {
            clearInterval(rollingTimer);
            document.querySelectorAll('.grid-item').forEach(item => {
                item.classList.remove('rolling', 'selected');
            });
            result.textContent = "等待抽取...";
            drawBtn.disabled = false;
        }
    </script>
